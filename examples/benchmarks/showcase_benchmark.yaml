name: showcase_protocol_advantage
repeat: 1
tasks:
  # ════════════════════════════════════════════
  # Phase A — Knowledge building
  # These tasks write memory that Phase B tasks will reuse.
  # They use sorting / search / frequency — classic algorithms
  # that trigger the full planner→retriever→executor→summarizer route.
  # ════════════════════════════════════════════
  - id: SH-A1
    group: A
    topic: implement quicksort
    input_file: examples/tasks/showcase/A1_quicksort.txt
    tags: [phase-a, sorting, algorithm]
  - id: SH-A2
    group: A
    topic: implement binary search
    input_file: examples/tasks/showcase/A2_binary_search.txt
    tags: [phase-a, searching, algorithm]
  - id: SH-A3
    group: A
    topic: word frequency counter
    input_file: examples/tasks/showcase/A3_word_freq.txt
    tags: [phase-a, frequency, text]

  # ════════════════════════════════════════════
  # Phase B — Memory reuse (warm start)
  # These tasks are semantically similar to Phase A tasks.
  # They should hit memory hits from Phase A with high similarity.
  # ════════════════════════════════════════════
  - id: SH-B1
    group: B
    topic: implement mergesort
    input_file: examples/tasks/showcase/B1_mergesort.txt
    tags: [phase-b, sorting, reuse]
    depends_on: [SH-A1]
  - id: SH-B2
    group: B
    topic: implement linear search
    input_file: examples/tasks/showcase/B2_linear_search.txt
    tags: [phase-b, searching, reuse]
    depends_on: [SH-A2]
  - id: SH-B3
    group: B
    topic: character frequency counter
    input_file: examples/tasks/showcase/B3_char_freq.txt
    tags: [phase-b, frequency, reuse]
    depends_on: [SH-A3]

  # ════════════════════════════════════════════
  # Phase C — Cold baseline (memory cleared)
  # Same tasks as Phase B but with no prior memory.
  # The metrics difference between B and C IS the memory reuse benefit.
  # ════════════════════════════════════════════
  - id: SH-C1
    group: C
    topic: implement mergesort (cold)
    input_file: examples/tasks/showcase/B1_mergesort.txt
    tags: [phase-c, sorting, cold]
    cold_start: true
  - id: SH-C2
    group: C
    topic: implement linear search (cold)
    input_file: examples/tasks/showcase/B2_linear_search.txt
    tags: [phase-c, searching, cold]
    cold_start: true
  - id: SH-C3
    group: C
    topic: character frequency counter (cold)
    input_file: examples/tasks/showcase/B3_char_freq.txt
    tags: [phase-c, frequency, cold]
    cold_start: true
