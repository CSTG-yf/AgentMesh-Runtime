name: continuous_tasks
repeat: 1
tasks:
  - id: SA1
    group: A
    topic: analyze sorting benchmark
    input_file: examples/tasks/standard/A1_analyze_sorting.txt
    tags: [analysis, sort, benchmark]
  - id: SA2
    group: A
    topic: implement quicksort
    input_file: examples/tasks/standard/A2_quicksort.txt
    tags: [code, sort, implement]
  - id: SA3
    group: A
    topic: compute sum and even count
    input_file: examples/tasks/standard/A3_sum_even.txt
    tags: [compute, count, statistics]
  - id: SB1
    group: B
    topic: search memory then benchmark sorting
    input_file: examples/tasks/standard/B1_memory_sort_benchmark.txt
    tags: [code, search, benchmark]
  - id: SB2
    group: B
    topic: character frequency count
    input_file: examples/tasks/standard/B2_char_freq.txt
    tags: [compute, frequency, text]
  - id: SB3
    group: B
    topic: compare linear vs binary search
    input_file: examples/tasks/standard/B3_compare_search.txt
    tags: [analysis, search, compare]
